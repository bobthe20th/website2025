<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<div id="map"></div>


<script>
const TILE_SIZE = 512;
const MAX_ZOOM = 4;
const IMAGE_SIZE = 1024;

//Marker Customization
//Add Icon
var greenIcon = L.icon({
    iconUrl: 'leaf-green.png',
    shadowUrl: 'leaf-shadow.png',

    iconSize:     [38, 95], // size of the icon
    shadowSize:   [50, 64], // size of the shadow
    iconAnchor:   [22, 94], // point of the icon which will correspond to marker's location
    shadowAnchor: [4, 62],  // the same for the shadow
    popupAnchor:  [-3, -76] // point from which the popup should open relative to the iconAnchor
});

//Markers
//Supply Depots
var farm = L.marker([-288, 383], {icon: greenIcon}).bindPopup('This is Littleton, CO.'),  //Farm
    gorey    = L.marker([-422, 372]).bindPopup('This is Denver, CO.'), //Gorey
    figari    = L.marker([-590, 374]).bindPopup('This is Aurora, CO.'), //Figari
    levvie    = L.marker([-678, 520]).bindPopup('This is Golden, CO.'); //Levvie
    regina    = L.marker([-849, 530]).bindPopup('This is Golden, CO.'); //Regina
    durras    = L.marker([-800, 671]).bindPopup('This is Golden, CO.'); //Durras
    sawmill    = L.marker([-625, 248]).bindPopup('This is Golden, CO.'); //Sawmill
    industrial    = L.marker([-535, 490]).bindPopup('This is Golden, CO.'); //Industial
var depots = L.layerGroup([farm, gorey, figari, levvie, regina, durras, sawmill, industrial]);

var newmap = L.tileLayer('./everon_tiles/{z}/{x}/{y}/tile.jpg', {
  tileSize: TILE_SIZE,
  minZoom: 0,
  maxZoom: MAX_ZOOM,
  noWrap: true
});



//Creates map and layer system
var map = L.map('map', {
  crs: L.CRS.Simple,
  center: [-540, 400],
  zoom: 0,
  layers: [newmap, depots]
});

var baseMaps = {
    "Topographic": newmap,
};

var overlayMaps = {
    "Supply Depots": depots
};

var layerControl = L.control.layers(baseMaps, overlayMaps).addTo(map);

//Temporary marker on click. Shows coordinates
map.on('click', function (e) {
    var lat = e.latlng.lat;
    var lng = e.latlng.lng;

    var marker = L.marker([lat, lng]).addTo(map);

    marker.bindPopup("Latitude: " + lat + "<br>Longitude: " + lng + "<p>The co-ordinates are borked. Will fix another time.</p>").openPopup();
});




</script>

</body>
</html>
