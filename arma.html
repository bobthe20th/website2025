<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<div id="map"></div>

<script>
const TILE_SIZE = 512;
const MAX_ZOOM = 4;

// Size of image at zoom 0
const IMAGE_SIZE = 1024;

// Define bounds (IMPORTANT)
const bounds = [[0, 0], [IMAGE_SIZE, IMAGE_SIZE]];

const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: 0,
  maxZoom: MAX_ZOOM,
  zoomSnap: 1,
  zoomDelta: 1
});

// Add tiles
L.tileLayer('https://bobthe20th.com/everon_tiles/{z}/{x}/{y}/tile.jpg', {
  tileSize: TILE_SIZE,
  minZoom: 0,
  maxZoom: MAX_ZOOM,
  noWrap: true,
  bounds: bounds   // 👈 THIS IS CRITICAL
}).addTo(map);

// Fit map to your image
map.fitBounds(bounds);

// Example marker (center of map)
L.marker([512, 512]).addTo(map);

</script>

</body>
</html>
