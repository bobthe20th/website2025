<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<div id="map"></div>

<script>
const TILE_SIZE = 512;
const MAX_ZOOM = 4;
const IMAGE_SIZE = 1024;

const bounds = [[0, 0], [IMAGE_SIZE, IMAGE_SIZE]];

const map = L.map('map', {
  crs: L.CRS.Simple,
  minZoom: 0,
  maxZoom: MAX_ZOOM,
  maxBounds: bounds,
  maxBoundsViscosity: 1.0
});

// 👇 create layer first
const layer = L.tileLayer('./everon_tiles/{z}/{x}/{y}/tile.jpg', {
  tileSize: TILE_SIZE,
  minZoom: 0,
  maxZoom: MAX_ZOOM,
  noWrap: true
});

// 👇 override tile requests
layer.getTileUrl = function(coords) {
  const tilesAtZoom = (IMAGE_SIZE / TILE_SIZE) * Math.pow(2, coords.z);

  if (
    coords.x < 0 || coords.y < 0 ||
    coords.x >= tilesAtZoom || coords.y >= tilesAtZoom
  ) {
    return ''; // 🚫 stops request completely
  }

  return L.Util.template(this._url, coords);
};

layer.addTo(map);

map.fitBounds(bounds);
L.marker([512, 512]).addTo(map);
</script>

</body>
</html>
